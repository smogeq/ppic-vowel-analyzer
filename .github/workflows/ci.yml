# Activity 4: on every push to main, build the Docker image and run it.
name: Vowel Frequency CI

on:
  push:
    branches: [ main ]

# The container pushes the updated README back to main, so it needs write access.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The slides use actions/checkout@v2, which is outdated. v4 still stores
      # the push credentials inside .git/config, which the container relies on.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vowel-frequency-analyzer:latest .

      - name: Run Docker container
        run: docker run --rm -e GITHUB_USER="${{ github.actor }}" vowel-frequency-analyzer:latest
